<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ExplainMyCode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <img src="/assets/explainmycode-logo.svg" alt="ExplainMyCode" width="300" height="72">
  </header>
  <div id="promptForCode">
    <h2>Drop your code below</h2>
    <select id="language">
      <option value="auto">Auto-detect</option>
      <option value="JavaScript">JavaScript</option>
      <option value="Python">Python</option>
      <option value="Java">Java</option>
      <option value="HTML">HTML</option>
      <option value="CSS">CSS</option>
      <option value="C++">C++</option>
    </select>
    <textarea id="codeInput" placeholder="Paste your code here..."></textarea>
    <button id="explainBtn">Explain</button>
  </div>
  <div id="result"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="script.js"></script>
  <script data-goatcounter="https://agaspar.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
